mutation CheckoutLineUpdate($id: ID!, $lineId: ID!, $quantity: Int!, $metadata: [MetadataInput!]) {
	checkoutLinesUpdate(id: $id, lines: { quantity: $quantity, lineId: $lineId, metadata: $metadata }) {
		checkout {
			lines {
				id
				variant {
					name
				}
				quantity
			}
			totalPrice {
				gross {
					currency
					amount
				}
			}
		}
	}
}
